<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="Cart.css">
    <title>Livia Lace</title>
</head>
<body>
    <div id="top">
        <a href="/"><img src="Imagens/Logo.png" alt="" id="logo"></a>

            <i class="fa-solid fa-user" id="account" onclick="changePage(this)"></i>
        </div>
    </div>
    <div id="content">
        <div id="payment">
            <p id="errorMessage">Preencha todos os dados na página do <span><a href="/User.html">Usuário</a></span></p>

            <input type="button" id="checkout" value="Prosseguir para pagamento">
        </div>
    </div>
    <script src="https://kit.fontawesome.com/0c24622cda.js" crossorigin="anonymous"></script>
    <script src="main.js"></script>
    <script src="cart.js"></script>

</html>
