<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="Catalogue.css">
    <title>Livia Lace</title>
</head>
<body>
    <div id="top">
        <a href="/"><img src="Imagens/Logo.png" alt="" id="logo"></a>
        <div class="icon">
            <i class="fa-solid fa-cart-shopping" id="cart" onclick="changePage(this)"></i>
            <i class="fa-solid fa-user" id="account" onclick="changePage(this)"></i>
        </div>
    </div>
    <header id="topo">        
        <p id="tagline">Laços feitos com amor. Delicadeza em cada detalhe</p>
    </header>
    <main>
        <aside>
            <h2>Filtros</h2>
            <hr>
            <label for="checkbico"><input type="checkbox" name="Bico de pato" id="checkbico" onclick="option(this)">Laço Bico de Pato</label>
            <label for="checkxuxinha"><input type="checkbox" name="Bico de pato" id="checkxuxinha" onclick="option(this)">Laço Xuxinha</label>
            <label for="checktiara"><input type="checkbox" name="Bico de pato" id="checktiara" onclick="option(this)">Tiara</label>
            <label for="checkfaixa"><input type="checkbox" name="Bico de pato" id="checkfaixa" onclick="option(this)">Laço faixa de bebe</label>
            <label for="checkpresilha"><input type="checkbox" name="Bico de pato" id="checkpresilha" onclick="option(this)">Laço Presilha de cabelo</label>
            <label for="checkpulseira"><input type="checkbox" name="Bico de pato" id="checkpulseira" onclick="option(this)">Pulseira</label>
            <hr>
            <h2>Valor</h2>
            <div id="value">
                <input type="text" name="inicial" id="preco-inicial" class="campus" placeholder="De R$0,00" oninput="this.value = this.value.replace(/\D/g, '')">
                <input type="text" name="final" id="preco-final" class="campus" placeholder="Até R$99,99" oninput="this.value = this.value.replace(/\D/g, '')">
            </div>
        </aside>
        <section>
             <div class="products">
                
            </div>
        </section>
    </main>
    <footer>
        <p id="linksName">Navegue:</p>
        <a href="#topo" id="frontPage" class="footerItem link position">Início</a>
        <a href="https://livia-lace.vercel.app" id="mainPage" class="footerItem link position">Página principal</a>

        <p id="contactsName">Contato:</p>

        <p id="socialsName">Redes:</p>
        <a href="https://www.instagram.com/livia_lacebr/" id="InstagramPage" class="footerItem link position" target="_blank" rel="nofollow">Instagram</a>
    </footer>
    <script src="https://kit.fontawesome.com/0c24622cda.js" crossorigin="anonymous"></script>
    <script src="main.js"></script>
    <script src="Catalogue.js"></script>
</body>
</html>
