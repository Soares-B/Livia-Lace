<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="Product.css">
    <title>Livia Lace</title>
</head>
<body>
    <div id="top">
        <a href="/"><img src="Imagens/Logo.png" alt="" id="logo"></a>
        <div class="icon">
            <i class="fa-solid fa-cart-shopping" id="cart" onclick="changePage(this)"></i>
            <i class="fa-solid fa-user" id="account" onclick="changePage(this)"></i>
        </div>
    </div>

    <div id="produto">
        <img src="" alt="" id="productImage">
        <div id="productInfo">
            <p id="path"></p>
            <p id="productName"></p>
            <p id="productPrice"></p>
        </div>
        <div id="info">
            <p id="quantidade"></p>
        </div>
        <div id="purchase">
            <div class="amount">
                <button class="diminuir">-</button>
                <span class="qtd">1</span>
                <button class="aumentar">+</button>
            </div>
            <input type="button" id="productPurchase" value="Adicionar ao carrinho">
        </div>
        <div id="svg">
            <img src="Imagens/BowSVG.png" id="bowSVG" alt="">
        </div>
    </div>
    <script src="https://kit.fontawesome.com/0c24622cda.js" crossorigin="anonymous"></script>
    <script src="main.js"></script>
    <script src="Product.js"></script>
</body>
</html>
