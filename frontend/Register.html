<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="Register.css">
    <title>Livia Lace</title>
</head>
<body>
    <p id="message">Registro realizado com sucesso!</p>
    <div id="infoCampus">
        <img src="Imagens/HeaderBackground.jpeg" alt="">
        <h2>Registrar</h2>
        <form action="/registerClient" method="POST">
            <p>E-mail</p>
            <input type="email" name="email" id="email" required autocomplete="off">
            <p>Nome de usuário</p>
            <input type="text" name="user" id="usernameRegister" required autocomplete="off">
            <p>Senha</p>
            <input type="password" name="password" id="passwordRegister" required autocomplete="off">
            <input type="submit" value="Registrar" id="registrar">
        </form>
        <p id="enter">Já possui uma conta? <a href="/Login.html">Entre aqui!</a></p>
    </div>
    <script src="Register.js"></script>
</body>
</html>
